name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install pytest
      run: pip install pytest
    - name: Run pytest (tests adversarios)
      run: pytest -v
    - name: Run benchmark 0/16
      run: python benchmark/run_benchmark.py
